# The installer's packages. A release published on GitHub gets them attached, and its tag gives the version; the README's download
# buttons rely on these names. Run by hand (Actions › Release › Run workflow) they're kept only as the run's artifact, to try, and
# no release changes.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        include:
          - { runner: windows-latest, rid: win-x64, asset: UltimateMP3Player-Installer-windows-x64-setup.exe }
          - { runner: ubuntu-latest, rid: linux-x64, asset: UltimateMP3Player-Installer-linux-x64.tar.gz }
          - { runner: macos-latest, rid: osx-arm64, asset: UltimateMP3Player-Installer-macos-arm64.zip }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      RID: ${{ matrix.rid }}
      ASSET: ${{ matrix.asset }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # What xtool prints, what went wrong, downloads, and every screen drawn once. One system is enough: none of it depends on it.
      - name: Checks
        if: runner.os == 'Windows'
        run: dotnet run --project tests/Shots -c Release -- "$RUNNER_TEMP/shots"

      # Trimmed, and not compressed inside: the setup or the archive around it does better (measured: 55 MB, 24 in a zip against 29
      # compressed), and it starts faster each time the bridge to the iPhone runs it (50 ms against 67).
      - name: Publish
        run: |
          VERSION="${TAG#v}"
          [ -n "$VERSION" ] || VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Installer/Installer.csproj)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          dotnet publish src/Installer/Installer.csproj -c Release -r "$RID" -o out/bin -p:Version="$VERSION" \
            --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:PublishReadyToRun=true -p:PublishReadyToRunComposite=false \
            -p:PublishTrimmed=true -p:TrimMode=partial -p:DebugType=none

      - name: Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco upgrade innosetup -y --no-progress | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$env:VERSION" packaging\installer.iss

      - name: Archive (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p out/pack
          case "$RID" in
            linux-*)
              DIR=out/pack/UltimateMP3Player-Installer
              mkdir -p "$DIR"
              cp out/bin/UltimateMP3PlayerInstaller LICENSE "$DIR/"
              cp -R licenses "$DIR/"
              chmod +x "$DIR/UltimateMP3PlayerInstaller"
              tar -C out/pack -czf "out/$ASSET" UltimateMP3Player-Installer
              ;;
            osx-*)
              APP="out/pack/Ultimate MP3 Player Installer.app"
              mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
              cp out/bin/UltimateMP3PlayerInstaller "$APP/Contents/MacOS/"
              cp packaging/app.icns LICENSE "$APP/Contents/Resources/"
              cp -R licenses "$APP/Contents/Resources/"
              sed "s/__VERSION__/$VERSION/g" packaging/Info.plist > "$APP/Contents/Info.plist"
              # No Apple certificate, but without any signature Apple Silicon Macs don't run it at all.
              codesign --force --deep -s - "$APP"
              ditto -c -k --sequesterRsrc --keepParent "$APP" "out/$ASSET"
              ;;
          esac

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "out/$ASSET" --clobber

      - name: Keep for trying (run by hand)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
